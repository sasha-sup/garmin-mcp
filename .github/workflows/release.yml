name: Release

# Push a tag like v0.2.0 from a commit whose plugin/.claude-plugin/plugin.json
# has the same version. The workflow builds binaries and the .mcpb bundle,
# pushes the Docker image and publishes server.json to the MCP Registry.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  binaries:
    name: Binaries and MCPB
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the GitHub Release
    outputs:
      mcpb_sha256: ${{ steps.mcpb.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plugin version matches the tag
        run: |
          want=${GITHUB_REF_NAME#v}
          got=$(jq -r .version plugin/.claude-plugin/plugin.json)
          [ "$got" = "$want" ] || { echo "::error::plugin/.claude-plugin/plugin.json has version $got but the tag is $GITHUB_REF_NAME: bump the plugin version, commit, and tag that commit"; exit 1; }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and upload the MCPB bundle
        id: mcpb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/build-mcpb.sh "${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" dist/garmin-mcp.mcpb --repo "$GITHUB_REPOSITORY"
          echo "sha256=$(sha256sum dist/garmin-mcp.mcpb | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

  image:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}

  registry:
    name: MCP Registry
    needs: [binaries, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # GitHub OIDC login to the registry
    env:
      PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install mcp-publisher (signature verified)
        run: |
          a=mcp-publisher_linux_amd64.tar.gz
          base=https://github.com/modelcontextprotocol/registry/releases/download/$PUBLISHER_VERSION
          curl -fsSLO "$base/$a"
          curl -fsSLO "$base/$a.sigstore.json"
          cosign verify-blob --bundle "$a.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$PUBLISHER_VERSION" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$a"
          tar xzf "$a" mcp-publisher
      - name: Fill version, image tag and bundle hash
        env:
          SHA256: ${{ needs.binaries.outputs.mcpb_sha256 }}
        run: |
          v=${GITHUB_REF_NAME#v}
          jq --arg v "$v" --arg sha "$SHA256" '
            .version = $v
            | (.packages[] | select(.registryType == "oci")).identifier = "ghcr.io/sasha-sup/garmin-mcp:\($v)"
            | (.packages[] | select(.registryType == "mcpb")) |= (.identifier = "https://github.com/sasha-sup/garmin-mcp/releases/download/v\($v)/garmin-mcp.mcpb" | .fileSha256 = $sha)
          ' server.json > server.tmp.json && mv server.tmp.json server.json
          cat server.json
      - run: ./mcp-publisher validate server.json
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish server.json
