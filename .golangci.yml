version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - funlen
    - gocognit
    - unparam
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - usestdlibvars
  settings:
    funlen:
      lines: 80
      statements: 40
    gocognit:
      min-complexity: 25
    gosec:
      excludes:
        - G104 # unhandled errors: covered by errcheck with its own exclusions
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, noctx, funlen, gocognit]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/sasha-sup/garmin-mcp
