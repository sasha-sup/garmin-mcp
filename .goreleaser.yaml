version: 2
project_name: garmin-mcp

builds:
  - id: garmin-mcp
    main: ./cmd/garmin-mcp
    binary: garmin-mcp
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

# One macOS binary for Intel and Apple Silicon.
universal_binaries:
  - ids: [garmin-mcp]
    replace: true

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md, README.ru.md, .env.example]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  filters:
    exclude: ["^docs:", "^test:", "^ci:"]
